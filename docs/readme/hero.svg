<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Evasion — Discord, YouTube и Telegram снова работают. Обход блокировок для Windows без VPN.">
  <defs>
    <radialGradient id="rwash"><stop stop-color="#3423c4"/><stop offset=".55" stop-color="#2a1c96" stop-opacity=".35"/><stop offset="1" stop-color="#2a1c96" stop-opacity="0"/></radialGradient>
    <filter id="rhalo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="21.3"/></filter>
    <filter id="rcore" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6.5"/></filter>
    <clipPath id="clip"><rect width="1280" height="460" rx="36"/></clipPath>
    <linearGradient id="grid" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <pattern id="lines" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0V26" stroke="url(#grid)" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset=".35" stop-color="#050506"/><stop offset="1" stop-color="#050506" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
    <rect width="1280" height="460" fill="#050506"/>
    <rect x="560" width="720" height="460" fill="url(#lines)"/>
    
  <circle cx="1046" cy="226" r="224" fill="url(#rwash)" opacity=".6"/>
  <circle cx="1046" cy="226" r="128" fill="#0b0b12"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="1046" cy="226" r="128" stroke="#5442ff" stroke-width="33.4" filter="url(#rhalo)"><animate attributeName="opacity" values=".75;1;.75" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1046" cy="226" r="128" stroke="#7c6cff" stroke-width="17.6" filter="url(#rcore)"/>
    <circle cx="1046" cy="226" r="128" stroke="#f1efff" stroke-width="9.3"/>
  </g>
  <circle cx="1046" cy="226" r="27.8" fill="#7c6cff" filter="url(#rcore)"/>
  <circle cx="1046" cy="226" r="16.7" fill="#fff"/><g><circle cx="1046" cy="98" r="4.2" fill="#fff" filter="url(#rcore)"/><animateTransform attributeName="transform" type="rotate" from="0 1046 226" to="360 1046 226" dur="9s" repeatCount="indefinite"/></g>
    <ellipse cx="1046" cy="418" rx="118" ry="13" fill="none" stroke="#7c6cff" stroke-opacity=".28" stroke-width="3" filter="url(#rcore)"/>
    <rect width="820" height="460" fill="url(#fade)"/>
    <g transform="translate(72 64)">
      <rect x=".5" y=".5" width="37" height="37" rx="11" fill="#050507" stroke="#fff" stroke-opacity=".16"/>
      <g transform="translate(-1.5 0) scale(.0371)" fill="none" stroke-linecap="round" stroke-width="102">
        <path d="M507 512H773" stroke="#7c6cff" filter="url(#rcore)" opacity=".8"/>
        <path d="M573 312H394A123 123 0 0 0 271 435V589A123 123 0 0 0 394 712H573" stroke="#f1efff"/>
        <path d="M507 512H773" stroke="#b9afff"/>
      </g>
      <text x="52" y="27" font-size="25" font-weight="600" fill="#f5f5f7" letter-spacing="-.6">evasion</text>
    </g>
    <text x="70" y="212" font-size="56" font-weight="600" fill="#6f6f7b" letter-spacing="-2.2">Discord, YouTube, Telegram</text>
    <text x="70" y="282" font-size="56" font-weight="600" fill="#f5f5f7" letter-spacing="-2.2">снова работают</text>
    <text x="72" y="340" font-size="21" fill="#a9a9b4">Обход блокировок для Windows. Одна кнопка — и ничего настраивать не нужно.</text>
    <rect x="72" y="374" width="208" height="38" rx="19.0" fill="#121214" stroke="#ffffff" stroke-opacity=".14"/>
  <circle cx="90" cy="393.0" r="4" fill="#7c6cff"/><text x="104" y="398.4" font-size="15" fill="#d6d6de" font-weight="500">Windows 10 / 11 · x64</text>
    <rect x="292" y="374" width="150" height="38" rx="19.0" fill="#121214" stroke="#ffffff" stroke-opacity=".14"/>
  <circle cx="310" cy="393.0" r="4" fill="#7c6cff"/><text x="324" y="398.4" font-size="15" fill="#d6d6de" font-weight="500">Один .exe</text>
    <rect x="454" y="374" width="132" height="38" rx="19.0" fill="#121214" stroke="#ffffff" stroke-opacity=".14"/>
  <circle cx="472" cy="393.0" r="4" fill="#7c6cff"/><text x="486" y="398.4" font-size="15" fill="#d6d6de" font-weight="500">Без VPN</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="459" rx="35.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>
