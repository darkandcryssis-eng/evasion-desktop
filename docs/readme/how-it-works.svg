<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Схема: приложение отправляет запрос, Evasion меняет первые пакеты соединения, фильтр провайдера не распознаёт сайт, сервер получает запрос целым.">
